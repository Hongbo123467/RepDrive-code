name: vjepa_cvt_single_lora32_dynamic_corp_visibility_retrain
root_dir: '/home/dataset-local/yinhongbo/datazoo/opv2v/train'
validate_dir: '/home/dataset-local/yinhongbo/datazoo/opv2v/validate'

train_params:
  batch_size: &batch_size 4
  epoches: &epoches 151
  eval_freq: 5
  save_freq: 10
  max_cav: &max_cav 5
  visible: true

fusion:
  core_method: 'CamIntermediateFusionDataset'
  args:
    queue_length: 2
    timestamp_offset: 0
    timestamp_offset_mean: 0
    timestamp_offset_std: 0

data_augment: []
add_data_extension: ['bev_dynamic.png', 'bev_static.png', 'bev_visibility.png', 'bev_visibility_corp.png', 'bev_lane.png']

preprocess:
  core_method: 'RgbPreprocessor'
  args:
    bgr2rgb: true
    resize_x: &image_width 512
    resize_y: &image_height 512
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]
  cav_lidar_range: &cav_lidar [-50, -50, -3, 50, 50, 1]

postprocess:
  core_method: 'CameraBevPostprocessor'
  anchor_args:
    cav_lidar_range: *cav_lidar
  order: 'hwl'
  max_num: 100
  nms_thresh: 0.15

model:
  core_method: vjepa_cvt_single
  args:
    target: &target 'dynamic'
    max_cav: *max_cav

    jepa_encoder:
      vjepa_version: '2.1'
      vjepa2_repo_path: '/home/dataset-local/yinhongbo/code/vjepa2-main'
      vjepa2_config_path: '/home/dataset-local/yinhongbo/code/vjepa2-main/configs/eval_2_1/vitl-384/in1k.yaml'
      model_weights: '/home/dataset-local/yinhongbo/modelzoo/V-JEPA/vjepa2_1_vitl_dist_vitG_384.pt'
      image_architecture: 'vit_large'
      vjepa2_resolution: [512, 512]
      image_size: [512, 512]
      img_as_video_nframes: 2
      backbone_mode: 'lora'
      lora_rank: 32
      num_scene_tokens: 64
      tf_d_model: 128
      spatial_hw: [32, 32]
      num_cams: 4
      use_grid_mask: false
      input_is_normalized: true

    cvm:
      dim: 128
      middle: [2]
      bev_embedding:
        sigma: 1.0
        bev_height: 256
        bev_width: 256
        h_meters: 100
        w_meters: 100
        offset: 0.0
        decoder_blocks: &decoder_block [32, 64, 128]
      cross_view:
        image_height: *image_height
        image_width: *image_width
        no_image_features: false
        skip: true
        heads: 4
        dim_head: 32
        qkv_bias: true

    decoder:
      input_dim: 128
      num_layer: 3
      num_ch_dec: *decoder_block

    seg_head_dim: 32
    output_class: 2

loss:
  core_method: vanilla_seg_loss
  args:
    target: *target
    d_weights: 75.0
    s_weights: 2.0
    l_weights: 4.0
    d_coe: 2.0
    s_coe: 1.0

optimizer:
  core_method: AdamW
  lr: 3e-4
  args:
    eps: 1e-10
    weight_decay: 1e-2

lr_scheduler:
  core_method: cosineannealwarm
  epoches: *epoches
  warmup_lr: 2e-5
  warmup_epoches: 10
  lr_min: 5e-6
